<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tr('Homedeck')</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />

  <meta name="x-icue-property" content="haUrl" data-label="tr('Home Assistant Address')" data-type="textfield" data-default="'http://homeassistant.local:8123'" />
  <meta name="x-icue-property" content="haToken" data-label="tr('Long-Lived Access Token')" data-type="textfield" data-default="''" />
  <meta name="x-icue-property" content="haEntities" data-label="tr('Entity IDs (comma-separated)')" data-type="textfield" data-default="''" />
  <meta name="x-icue-property" content="tapToToggle" data-label="tr('Touch Control')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="showStatusBar" data-label="tr('Connection Status Bar')" data-type="switch" data-default="true" />

  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#f2f4f7'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#ffb45e'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#000000'" />
  <meta name="x-icue-property" content="backgroundMedia" data-label="tr('Background Image')" data-type="media-selector"
        data-filters="['*.png','*.jpg','*.jpeg','*.webp','*.gif']" />
  <meta name="x-icue-property" content="bgBrightness" data-label="tr('Background Brightness')" data-type="slider"
        data-default="70" data-min="20" data-max="100" data-step="1" data-unit-label="'%'" />
  <meta name="x-icue-property" content="glassBlur" data-label="tr('Glass Blur')" data-type="slider"
        data-default="0" data-min="0" data-max="30" data-step="1" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider"
        data-default="0" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />

  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('Homedeck')", "properties": ["haUrl", "haToken", "haEntities", "tapToToggle", "showStatusBar"], "info": "tr('Create the token in Home Assistant under Profile, Security. Example entities: light.kitchen, sensor.living_room_temperature. Tap toggles, a long press opens dimming and temperature controls.')" },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "backgroundMedia", "bgBrightness", "glassBlur", "transparency"] }
  ]
  </script>

  <link rel="stylesheet" type="text/css" href="styles/Homedeck.css" />
</head>
<body>
  <div class="widget-root" id="root" data-state="loading">
    <div class="widget-background">
      <div class="media-background" id="media-background"></div>
      <div class="bg-color"></div>
    </div>

    <div class="status" id="status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text"></span>
      <span class="status-count" id="status-count"></span>
    </div>

    <main class="board" id="board" aria-live="polite"></main>

    <div class="panel" id="panel" hidden="hidden"></div>

    <div class="notice" id="notice" hidden="hidden">
      <div class="notice-icon" id="notice-icon"></div>
      <div class="notice-title" id="notice-title"></div>
      <div class="notice-hint" id="notice-hint"></div>
    </div>
  </div>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/icons.js"></script>
  <script src="scripts/media-background.js"></script>
  <script src="scripts/entities.js"></script>
  <script src="scripts/ha-client.js"></script>
  <script src="scripts/controls.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
