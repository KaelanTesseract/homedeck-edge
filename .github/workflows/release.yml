name: Release

# Push a tag like v0.9.0 -> the widget package is built and attached to a DRAFT release together
# with SHA256SUMS.txt. Publishing the draft stays a manual step on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Check that the widget carries the tag's version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $widget = (Get-Content widget/manifest.json -Raw | ConvertFrom-Json).version
          if ($widget -ne $v) { throw "Version mismatch: tag $v, widget $widget" }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package widget
        run: |
          npm install -g icuewidget-cli
          icuewidget package widget -o "artifacts/Homedeck-${{ steps.version.outputs.value }}.icuewidget"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $pkg = "artifacts/Homedeck-$v.icuewidget"
          # LF line endings, so "sha256sum -c SHA256SUMS.txt" also works on Linux/macOS
          $sums = Get-FileHash $pkg -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          gh release create "${{ github.ref_name }}" --draft --title "Homedeck Edge $v" --notes-file docs/release-notes.md `
            $pkg artifacts/SHA256SUMS.txt
